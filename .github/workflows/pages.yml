# The hosted console: a static build of apps/console on GitHub Pages. It talks straight to public XRPL nodes from the
# visitor's browser and signs with the visitor's own wallet (Xaman, Joey, GemWallet, Crossmark, or a Testnet dev
# wallet). There is no backend. Agent approvals still need the local adapter (npx @xrpl-agent/mcp).
name: Hosted console
on:
  push:
    branches: [main]
    paths: ["apps/console/**", "packages/core/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @xrpl-agent/core && npm run build -w @xrpl-agent/console
        env:
          VITE_XAMAN_API_KEY: ${{ vars.XAMAN_API_KEY }}   # public app key (repo variable, optional)
          VITE_HOSTED: "1"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/console/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
